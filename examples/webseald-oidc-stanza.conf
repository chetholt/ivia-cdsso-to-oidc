# Example, working [oidc] / [oidc:default] stanza for an RP instance.
#
# Replace:
#   <rp-hostname>:<port>        - this RP's own external hostname/port
#   <op-hostname>:<port>        - the OP's external hostname/port
#   <definition-name>           - the OpenID Connect and API Protection
#                                  definition name on the OP (URL-encode
#                                  spaces, e.g. "My Definition" -> "My%20Definition")
#   <client-id>, <client-secret> - from the client registered for this RP
#                                  on the OP (see docs/03-op-setup.md)

[oidc]

# Enable authentication using the OIDC RP mechanism
# One of <http, https, both, none>
oidc-auth = https

# The default OP to be used. This should correspond to
# the second component of a qualified oidc configuration stanza.
default-op = default

[oidc:default]

# This is the host which is used in the redirect URI registered with the OIDC
# OP. Host and port ONLY - no scheme, no path. WebSEAL builds the final
# redirect URI as https://<redirect-uri-host>/pkmsoidc automatically.
# This must match the Redirect URI registered on the client at the OP,
# exactly.
redirect-uri-host = <rp-hostname>:<port>

# The discovery end-point for the OP. The CA certificate for the
# discovery-endpoint and corresponding authorization and token endpoints must
# be added to THIS reverse proxy instance's SSL key database.
discovery-endpoint = https://<op-hostname>:<port>/mga/sps/oauth/oauth20/metadata/<definition-name>

# The proxy, if any, which is used to reach the OIDC end-points.
proxy =

# Our client identifier, as registered with the OP.
client-id = <client-id>

# Authorization code flow. This is the only grant type this guide's
# browser-login pattern needs.
response-type = code

# Must match the "Require PKCE" setting on the client at the OP - both
# on, or both off.
enable-pkce = yes

response-mode = query

# Additional scopes beyond 'openid', space-separated. Usually left blank.
scopes =

bearer-token-attributes =
id-token-attributes =

# Additional query string arguments to forward onto the outbound request
# to the OP, beyond the standard OIDC parameters. Not needed for the
# basic login flow this guide covers - the "land back on the originally
# requested resource" behavior comes from WebSEAL's own native
# unauthenticated-access handling, not from a Target query parameter.
# See docs/04-rp-setup.md.
allowed-query-arg =

# Constructs the Verify Identity Access principal name from ID token
# claims. {iss}/{sub} avoids collisions if this RP is ever configured
# against more than one OP.
mapped-identity = {iss}/{sub}

external-user = true

# client-secret is added here manually the first time (no placeholder is
# provided in the stock template). After the reverse proxy is restarted,
# WebSEAL obfuscates this value and moves it to the bottom of the stanza -
# that's expected, not a sign it was lost.
client-secret = <client-secret>
